name: mobilem
description: Mobile measuring toolkit app.
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.2
  flutter_screenutil: ^5.9.3
  sqflite: ^2.4.2
  path: ^1.9.1
  sensors_plus: ^6.1.1
  camera: ^0.11.1
  flutter_timezone: ^4.1.0
  geolocator: ^13.0.2
  torch_light: ^1.1.0
  vibration: ^3.1.3
  package_info_plus: ^8.0.0
  intl: ^0.20.2
  dio: ^5.4.3+1
  flutter_inappwebview: ^6.1.5
  google_fonts: ^6.2.1
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

  # flutter pub run flutter_launcher_icons:main
flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

flutter:
  uses-material-design: true
